const P1={l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p:'KeyF',k:'KeyG',s:'KeyR'},P2={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p:'KeyK',k:'KeyL',s:'KeyO'};
const mk=(n,img,x,face,keys,col)=>({n,img,x,face,keys,col,wins:0,ai:0,id:n});
const A=mk('JOHN',0,240,1,P1,'#4da3ff'),B=mk('HUSEIN',0,720,-1,P2,'#ff5a4d');
function reset(){for(const f of[A,B]){Object.assign(f,{y:GY,vx:0,vy:0,hp:100,st:'idle',t:0,hit:0});}A.x=240;B.x=720;A.face=1;B.face=-1;A.mp=A.mp||0;B.mp=B.mp||0;fb=[];fx=[];timer=99;tick=0}
function startMatch(m){mode=m;A.wins=B.wins=0;A.mp=B.mp=0;reset();state='fight';document.getElementById('m').style.display='none'}
document.getElementById('b1').onclick=()=>startMatch(1);document.getElementById('b2').onclick=()=>startMatch(2);
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
 for(const[f,o]of[[A,P1],[B,P2]]){if(f===B&&mode==1)continue;for(const a of['p','k','s'])if(e.code==o[a])buf[f.id]=a}
 if(e.code=='Enter'&&state=='over'){startMatch(mode)}});
addEventListener('keyup',e=>K[e.code]=0);
const DUR={punch:22,kick:32,special:40,hit:18};
function ai(f,o){const k=f.keys,d=Math.abs(o.x-f.x);for(const a in k)K[k[a]]=0;f.ai--;
 if(f.ai<=0){f.ai=8+Math.random()*14|0;f.plan=d>150?'go':d<90?(Math.random()<.4?'back':'atk'):(Math.random()<.6?'atk':'go');if(Math.random()<.12)f.plan='blk'}
 const to=o.x<f.x?k.l:k.r,aw=o.x<f.x?k.r:k.l;
 if(f.plan=='go')K[to]=1;if(f.plan=='back')K[aw]=1;if(f.plan=='blk'||(o.st=='punch'||o.st=='kick')&&d<150&&Math.random()<.5)K[k.d]=1;
 if(f.plan=='atk'&&d<150&&Math.random()<.18)buf[f.id]=Math.random()<.5?'p':'k';
 if(f.mp>=100&&d>220&&Math.random()<.05)buf[f.id]='s';if(Math.random()<.008&&f.y==GY)K[k.u]=1}
function hurt(t,from,dmg,kb){const blk=t.st=='block'&&(from.x-t.x)*t.face>0;
 if(blk){dmg*=.15;t.vx=-t.face*4;t.mp=Math.min(100,t.mp+4)}else{t.st='hit';t.t=0;t.vx=-t.face*kb;t.hit=6;shake=6;from.mp=Math.min(100,from.mp+dmg*2.2)}
 t.hp=Math.max(0,t.hp-dmg);fx.push({x:t.x,y:t.y-130,t:0,b:blk});
 if(t.hp<=0&&!blk){t.st='ko';t.t=0;t.vy=-11;t.vx=-t.face*9;shake=14}}
function upd(f,o){const k=f.keys,g=f.y>=GY;
 if(f.st=='ko'){f.t++}else{
 const free=['idle','block'].includes(f.st);f.t++;
 if(free){f.st=K[k.d]&&g?'block':'idle';f.vx=((K[k.r]?1:0)-(K[k.l]?1:0))*(f.st=='block'?0:5);
  if(K[k.u]&&g)f.vy=-17;if(g)f.face=o.x>f.x?1:-1;
  const a=buf[f.id];if(a&&f.st=='idle'){f.st=a=='p'?'punch':a=='k'?'kick':(f.mp>=100?'special':'idle');if(f.st=='special')f.mp=0;f.t=0}}
 else{f.vx*=.85}
 delete buf[f.id];
 const dx=(o.x-f.x)*f.face,near=dx>0&&Math.abs(o.y-f.y)<100;
 if(f.st=='punch'&&f.t==7&&near&&dx<115)hurt(o,f,6,6);
 if(f.st=='kick'&&f.t==11&&near&&dx<140)hurt(o,f,10,10);
 if(f.st=='special'&&f.t==14)fb.push({x:f.x+f.face*60,y:f.y-120,vx:f.face*10,o:f});
 if(DUR[f.st]&&f.t>=DUR[f.st]){f.st='idle';f.t=0}}
 f.x+=f.vx;f.vy+=.9;f.y+=f.vy;if(f.y>=GY){f.y=GY;f.vy=0}if(f.st=='ko')f.vx*=.9;
 f.x=Math.max(60,Math.min(900,f.x));if(f.hit>0)f.hit--}
function sep(){const d=B.x-A.x;if(Math.abs(d)<55&&Math.abs(A.y-B.y)<90){const p=(55-Math.abs(d))/2*Math.sign(d||1);A.x-=p;B.x+=p}}
function endRound(w,why){state='end';msgT=150;msg=why;if(w)w.wins++;
 if(w&&w.wins>=2){msg=w.n+' MENANG!';state='over'}else if(!w)msg='SERI!'}
function loop(){tick++;
 if(state=='fight'){if(mode==1)ai(B,A);upd(A,B);upd(B,A);sep();
  for(const b of fb.slice()){b.x+=b.vx;const t=b.o===A?B:A;
   if(Math.abs(b.x-t.x)<45&&Math.abs(b.y-(t.y-110))<100){hurt(t,b.o,12,12);fb.splice(fb.indexOf(b),1)}else if(b.x<-40||b.x>1000)fb.splice(fb.indexOf(b),1)}
  if(tick%60==0&&timer>0)timer--;
  if(A.hp<=0||B.hp<=0){state='wait';setTimeout(()=>{if(state=='wait')endRound(A.hp<=0&&B.hp<=0?null:A.hp<=0?B:A,'K.O.!')},900)}
  else if(timer<=0)endRound(A.hp==B.hp?null:A.hp>B.hp?A:B,'WAKTU HABIS')}
 else if(state=='wait'){upd(A,B);upd(B,A)}
 else if(state=='end'){upd(A,B);upd(B,A);if(--msgT<=0){reset();state='fight'}}
 else if(state=='over'){upd(A,B);upd(B,A)}
 draw();requestAnimationFrame(loop)}
const SP={};for(const k in SPD){const i=new Image();i.src=SPD[k].d;SP[k]=Object.assign({img:i},SPD[k])}
function pick(f){const t=f.t,st=f.st,j=f.n=='JOHN',mv=Math.abs(f.vx)>1&&f.y>=GY,air=f.y<GY-2,b=(tick>>(mv?3:5))&1;
 if(j){if(st=='punch')return t>=5&&t<17?'J_p':t<5?'J_g':'J_i';
  if(st=='kick')return t<7?'J_g':t<11?'J_k1':t<24?'J_k2':'J_i';
  if(st=='special')return t<14?'J_g':t<34?'J_p':'J_i';
  if(st=='block'||air)return 'J_g';return b?'J_g':'J_i'}
 if(st=='punch')return t>=5&&t<17?'H_p':'H_i';
 if(st=='kick')return t<11?'H_n':t<24?'H_k':'H_i';
 if(st=='special')return t>=14&&t<34?'H_p':'H_i';

function spr(f){const S=SP[pick(f)],sc=S.sc,t=f.t,st=f.st;let tx=0,rot=0,dy=0,sy=1;
 if(st=='idle')dy=-Math.abs(Math.sin(tick*.1))*2;
 if(Math.abs(f.vx)>1&&f.y>=GY&&st=='idle')dy=-Math.abs(Math.sin(tick*.4))*4;
 if(st=='block'){sy=.94}
 if(st=='hit'){rot=-.2;tx=-10}
 if(st=='ko')rot=-Math.min(1.45,t*.16);
 ctx.save();ctx.translate(f.x,f.y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,0,50-(GY-f.y)/8,9,0,0,7);ctx.fill();
 ctx.scale(f.face,1);ctx.translate(tx,dy);ctx.rotate(rot);ctx.scale(1,sy);ctx.imageSmoothingEnabled=false;
 if(f.hit%2==1||st=='hit'&&t<4)ctx.filter='brightness(2.2)';
 ctx.drawImage(S.img,-S.ax*sc,-S.h*sc,S.w*sc,S.h*sc);ctx.filter='none';
 if(st=='block'){ctx.strokeStyle='rgba(130,210,255,.75)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(20,-120,85,-1.1,1.1);ctx.stroke()}
 if(st=='kick'&&t>=11&&t<20||st=='punch'&&t>=7&&t<13){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=5;ctx.beginPath();const k=st=='kick';ctx.arc(k?30:10,k?-140:-170,k?120:100,-.5,.4);ctx.stroke()}
 ctx.restore()}
function bar(x,w,f,right){ctx.fillStyle='#000';ctx.fillRect(x-3,17,w+6,26);ctx.fillStyle='#600';ctx.fillRect(x,20,w,20);
 const hw=w*f.hp/100;ctx.fillStyle=f.hp>30?'#ffd400':'#ff3b30';ctx.fillRect(right?x+w-hw:x,20,hw,20);
 ctx.fillStyle='#000';ctx.fillRect(x-2,508,w*.6+4,14);ctx.fillStyle=f.col;const mw=w*.6*f.mp/100;ctx.fillRect(right?x+w*.6-mw:x,510,mw,10);
 ctx.fillStyle='#fff';ctx.font='bold 18px Courier New';ctx.textAlign=right?'right':'left';ctx.fillText(f.n,right?x+w:x,62);
 for(let i=0;i<2;i++){ctx.fillStyle=i<f.wins?'#ffd400':'#333';ctx.beginPath();ctx.arc(right?x+w-8-i*20:x+8+i*20,76,7,0,7);ctx.fill()}}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}
 if(BG.complete)ctx.drawImage(BG,0,0,960,540);
 const ord=A.y<B.y?[A,B]:[B,A];ord.forEach(spr);
 for(const b of fb){const g=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,34);g.addColorStop(0,'#fff');g.addColorStop(.4,'#6cf');g.addColorStop(1,'rgba(0,80,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,34,0,7);ctx.fill()}
 for(const e of fx.slice()){e.t++;ctx.strokeStyle=e.b?'#8cf':'#fff';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<8;i++){const a=i*.785,r1=8+e.t*3,r2=r1+14;ctx.moveTo(e.x+Math.cos(a)*r1,e.y+Math.sin(a)*r1);ctx.lineTo(e.x+Math.cos(a)*r2,e.y+Math.sin(a)*r2)}ctx.stroke();if(e.t>8)fx.splice(fx.indexOf(e),1)}
 ctx.restore();
 bar(20,380,A,false);bar(560,380,B,true);
 ctx.fillStyle='#000';ctx.fillRect(430,14,100,40);ctx.fillStyle='#fff';ctx.font='bold 32px Courier New';ctx.textAlign='center';ctx.fillText(String(timer).padStart(2,'0'),480,46);
 if(state=='end'||state=='over'||state=='wait'&&msg){ctx.font='bold 64px Courier New';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(msg,480,270);ctx.fillStyle='#ffd400';ctx.fillText(msg,480,270);
  if(state=='over'){ctx.font='bold 22px Courier New';ctx.strokeText('Tekan ENTER untuk main lagi',480,320);ctx.fillStyle='#fff';ctx.fillText('Tekan ENTER untuk main lagi',480,320)}}
 if(state=='fight'&&tick<70){ctx.font='bold 64px Courier New';ctx.lineWidth=8;ctx.strokeStyle='#000';const s=tick<35?'SIAP...':'LAWAN!';ctx.strokeText(s,480,270);ctx.fillStyle='#fff';ctx.fillText(s,480,270)}}
reset();loop();
