let state='ready',bird,pipes,score,best=0,frame,shake=0;
try{best=+localStorage.getItem('ff_best')||0}catch(e){}

function reset(){bird={x:90,y:H/2-40,v:0,rot:0};pipes=[];score=0;frame=0;shake=0;}
reset();

function flap(){
  if(state==='ready'){state='play';bird.v=-7.2;}
  else if(state==='play'){bird.v=-7.2;}
  else if(state==='over'&&bird.y>=H-GROUND-R-1){state='ready';reset();}
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap();}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap();});

function die(){
  state='over';shake=14;bird.v=-3;
  if(score>best){best=score;try{localStorage.setItem('ff_best',best)}catch(e){}}
}

function update(){
  frame++;
  if(state==='ready'){bird.y=H/2-40+Math.sin(frame/12)*8;return;}
  bird.v+=0.42;bird.y+=bird.v;
  bird.rot=Math.max(-0.4,Math.min(1.2,bird.v/10));
  if(state==='play'){
    if(frame%90===1){pipes.push({x:W+10,top:70+Math.random()*(H-GROUND-GAP-140),passed:false});}
    for(const p of pipes){
      p.x-=2.6;
      if(!p.passed&&p.x+PIPE_W<bird.x-R){p.passed=true;score++;}
      const hitX=bird.x+R*0.85>p.x&&bird.x-R*0.85<p.x+PIPE_W;
      if(hitX&&(bird.y-R*0.85<p.top||bird.y+R*0.85>p.top+GAP))die();
    }
    pipes=pipes.filter(p=>p.x>-PIPE_W-10);
    if(bird.y-R<0){bird.y=R;bird.v=0;}
    if(bird.y+R>H-GROUND)die();
  }
  if(state==='over'){
    if(shake>0)shake--;
    if(bird.y+R>=H-GROUND){bird.y=H-GROUND-R;bird.v=0;bird.rot=1.2;}
  }
}

function drawFace(x,y,r,shocked,rot){
  const dw=52,dh=dw*177/136;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot*0.5);
  if(shocked){const s=1+Math.max(0,shake)*0.012;ctx.scale(s,s);}
  const flapA=state==='over'?-1:(state==='play'?Math.sin(frame*0.55)*0.6:Math.sin(frame*0.2)*0.25);
  for(const s of [-1,1]){
    ctx.save();ctx.translate(s*dw*0.44,4);ctx.scale(s,1);
    for(let i=0;i<3;i++){
      ctx.save();ctx.rotate(-0.4-flapA+(i-1)*0.45);
      ctx.fillStyle='#fff';ctx.strokeStyle='#8fb4d9';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.ellipse(11,0,12,4.5,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
  {const I=shocked&&img2.naturalWidth?img2:img;const h2=dw*I.naturalHeight/I.naturalWidth;ctx.drawImage(I,-dw/2,-h2/2,dw,h2);}
  ctx.shadowColor='transparent';
  ctx.restore();
}

function drawPipe(p){
  const g=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
  g.addColorStop(0,'#5fbf3a');g.addColorStop(.5,'#8be05a');g.addColorStop(1,'#4aa02c');
  ctx.fillStyle=g;ctx.strokeStyle='#2d6a17';ctx.lineWidth=2;
  ctx.fillRect(p.x,0,PIPE_W,p.top);ctx.strokeRect(p.x,0,PIPE_W,p.top);
  ctx.fillRect(p.x-4,p.top-24,PIPE_W+8,24);ctx.strokeRect(p.x-4,p.top-24,PIPE_W+8,24);
  const b=p.top+GAP;
  ctx.fillRect(p.x,b,PIPE_W,H-GROUND-b);ctx.strokeRect(p.x,b,PIPE_W,H-GROUND-b);
  ctx.fillRect(p.x-4,b,PIPE_W+8,24);ctx.strokeRect(p.x-4,b,PIPE_W+8,24);
}

function text(t,x,y,size,align='center'){
  ctx.font='bold '+size+'px system-ui,sans-serif';ctx.textAlign=align;
  ctx.lineWidth=5;ctx.strokeStyle='#1a1a1a';ctx.strokeText(t,x,y);
  ctx.fillStyle='#fff';ctx.fillText(t,x,y);
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#6fc3ff');sky.addColorStop(1,'#cdeeff');
  ctx.fillStyle=sky;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='rgba(255,255,255,.8)';
  for(const [cx,cy] of [[70,110],[240,70],[310,190]]){
    const o=(frame*0.15)%420;const x=((cx-o)%420+420)%420-30;
    ctx.beginPath();ctx.arc(x,cy,18,0,7);ctx.arc(x+20,cy+4,22,0,7);ctx.arc(x+42,cy,16,0,7);ctx.fill();
  }
  pipes.forEach(drawPipe);
  ctx.fillStyle='#ded895';ctx.fillRect(0,H-GROUND,W,GROUND);
  ctx.fillStyle='#73bf2e';ctx.fillRect(0,H-GROUND,W,12);
  ctx.fillStyle='#c9bf6e';
  const off=state==='play'?(frame*2.6)%24:0;
  for(let x=-24;x<W+24;x+=24)ctx.fillRect(x-off,H-GROUND+22,12,6);
  drawFace(bird.x,bird.y,R,state==='over',bird.rot);
  if(state!=='ready')text(score,W/2,70,44);
  if(state==='ready'){text('Flappy Face',W/2,150,38);text('Tap untuk mulai',W/2,H-GROUND-30,20);}
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(40,170,W-80,170);
    text('KAGET!',W/2,215,34);
    text('Skor: '+score,W/2,258,24);
    text('Terbaik: '+best,W/2,292,20);
    text('Tap untuk main lagi',W/2,325,16);
  }
  ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
